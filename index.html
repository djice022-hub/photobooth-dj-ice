<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photobooth DJ ICE</title>
  
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tes identifiants Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAY9K0dGnFDUSHV3W7G5l6X_XrlXub5scs",
      authDomain: "photobooth-dj-ice.firebaseapp.com",
      projectId: "photobooth-dj-ice",
      storageBucket: "photobooth-dj-ice.firebasestorage.app",
      messagingSenderId: "317176553708",
      appId: "1:317176553708:web:09c5177d85c61ffc36c5c9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firestoreTools = { collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: white; font-family: 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; user-select: none; }
    .container { position: relative; width: 100vw; height: 100vh; }
    video, #photoResult { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .overlay-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; object-fit: fill; z-index: 10; }
    #photoResult { display: none; z-index: 5; }
    video { z-index: 1; }
    .countdown {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 14rem; font-weight: 900; color: #fff; text-shadow: 0 0 40px rgba(0,0,0,0.9); display: none; z-index: 20;
    }
    .btn-shoot {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 22px 60px; font-size: 2rem; background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; z-index: 30;
      box-shadow: 0 6px 30px rgba(255, 0, 85, 0.6);
    }
    .top-bar { position: absolute; top: 20px; right: 20px; display: flex; gap: 12px; z-index: 35; }
    .btn-top {
      padding: 12px 20px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
      color: white; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1rem;
    }
    #djNotice {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); border: 2px solid #ff0055; padding: 20px 40px; border-radius: 40px;
      font-size: 1.8rem; font-weight: bold; color: #fff; text-align: center; display: none; z-index: 40;
    }
    #reloadNotice {
      position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.75);
      padding: 12px 25px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; display: none; z-index: 40;
    }
    .modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95); z-index: 100; display: none; flex-direction: column; padding: 30px; overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .btn-action { padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
    .btn-close { background: #ff3333; color: white; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .gallery-item { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; border: 2px solid #333; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-item-actions {
      position: absolute; bottom: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 5px;
    }
    .gallery-item-actions a, .btn-delete {
      background: rgba(0,0,0,0.8); color: white; padding: 6px 12px; border-radius: 15px; text-decoration: none; font-size: 0.85rem; border: none; cursor: pointer;
    }
    .btn-delete { background: rgba(255, 0, 0, 0.8); }
    .status-badge {
      position: absolute; top: 20px; left: 20px; padding: 8px 15px; border-radius: 20px;
      font-weight: bold; font-size: 0.9rem; z-index: 50; background: rgba(0,200,80,0.8);
    }
  </style>
</head>
<body>

  <div class="status-badge" id="syncStatus">⚡ Direct Cloud Active</div>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <img id="photoResult" alt="Photo prise" />
    <img id="frame" class="overlay-frame" src="" alt="Cadre" onError="this.style.display='none'" />
    <div id="countdown" class="countdown">3</div>
    
    <div class="top-bar">
      <label class="btn-top">🖼️ Cadre <input type="file" id="frameInput" accept="image/png" style="display:none" onchange="uploadFrame(event)"></label>
      <button class="btn-top" onclick="toggleGallery()">📸 Galerie (<span id="photoCount">0</span>)</button>
    </div>

    <div id="djNotice">📱 Venez chercher votre photo auprès du DJ</div>
    <div id="reloadNotice">Photo affichée pendant <span id="timerSec">15</span>s...</div>
    <button id="startBtn" class="btn-shoot" onclick="startPhotobooth()">📸 PRENDRE UNE PHOTO</button>
  </div>

  <div id="galleryModal" class="modal">
    <div class="modal-header">
      <h2>Galerie en Direct - DJ ICE</h2>
      <div>
        <button class="btn-action btn-close" onclick="toggleGallery()">Fermer ❌</button>
      </div>
    </div>
    <div id="galleryGrid" class="grid-container"></div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let localPhotos = [];
    const video = document.getElementById('webcam');
    const photoResult = document.getElementById('photoResult');
    const countdownEl = document.getElementById('countdown');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('canvas');
    const djNotice = document.getElementById('djNotice');
    const galleryModal = document.getElementById('galleryModal');
    const galleryGrid = document.getElementById('galleryGrid');
    const photoCountEl = document.getElementById('photoCount');
    const reloadNotice = document.getElementById('reloadNotice');
    const frameImg = document.getElementById('frame');

    const checkFirebase = setInterval(() => {
      if (window.db && window.firestoreTools) {
        clearInterval(checkFirebase);
        initFirebaseSync();
      }
    }, 200);

    function initFirebaseSync() {
      const { collection, onSnapshot, query, orderBy } = window.firestoreTools;
      const q = query(collection(window.db, "photos"), orderBy("timestamp", "desc"));

      onSnapshot(q, (snapshot) => {
        localPhotos = [];
        snapshot.forEach((doc) => {
          localPhotos.push({ id: doc.id, ...doc.data() });
        });
        renderGallery();
      });
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1200 } } });
        video.srcObject = stream;
      } catch (err) {
        console.warn("Caméra non disponible sur cet appareil (mode réception seul)");
      }
    }

    function takePhoto() {
      const context = canvas.getContext('2d');
      const w = video.videoWidth || 1920;
      const h = video.videoHeight || 1200;
      canvas.width = w; canvas.height = h;
      
      context.drawImage(video, 0, 0, w, h);

      if (frameImg.src && frameImg.style.display !== 'none') {
        context.drawImage(frameImg, 0, 0, w, h);
      }

      const imageData = canvas.toDataURL('image/jpeg', 0.80);

      const { collection, addDoc } = window.firestoreTools;
      addDoc(collection(window.db, "photos"), {
        image: imageData,
        timestamp: Date.now()
      });

      photoResult.src = imageData;
      video.style.display = 'none';
      photoResult.style.display = 'block';
      djNotice.style.display = 'block';
      reloadNotice.style.display = 'block';

      setTimeout(() => resetToCamera(), 15000);
    }

    function renderGallery() {
      photoCountEl.innerText = localPhotos.length;
      galleryGrid.innerHTML = "";
      localPhotos.forEach((item) => {
        const gridItem = document.createElement('div');
        gridItem.className = 'gallery-item';
        gridItem.innerHTML = `
          <img src="${item.image}" alt="Photo" />
          <div class="gallery-item-actions">
            <a href="${item.image}" download="photo_dj_ice_${item.timestamp}.jpg">💾 Enregistrer</a>
            <button class="btn-delete" onclick="deletePhoto('${item.id}')">🗑️ Supprimer</button>
          </div>
        `;
        galleryGrid.appendChild(gridItem);
      });
    }

    function deletePhoto(docId) {
      if (confirm("Supprimer la photo ?")) {
        const { doc, deleteDoc } = window.firestoreTools;
        deleteDoc(doc(window.db, "photos", docId));
      }
    }

    function uploadFrame(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          frameImg.src = e.target.result;
          frameImg.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function toggleGallery() {
      galleryModal.style.display = (galleryModal.style.display === 'flex') ? 'none' : 'flex';
    }

    function resetToCamera() {
      photoResult.style.display = 'none';
      djNotice.style.display = 'none';
      reloadNotice.style.display = 'none';
      video.style.display = 'block';
      startBtn.style.display = 'block';
    }

    function startPhotobooth() {
      startBtn.style.display = 'none';
      let count = 3;
      countdownEl.innerText = count;
      countdownEl.style.display = 'block';
      const timer = setInterval(() => {
        count--;
        if (count > 0) countdownEl.innerText = count;
        else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          takePhoto();
        }
      }, 1000);
    }

    initCamera();
  </script>
</body>
</html>
