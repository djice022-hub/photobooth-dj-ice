<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photobooth - DJ ICE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    
    body {
      background-color: #000;
      color: white;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, #photoResult {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    video {
      z-index: 1;
      transform: scaleX(-1);
    }

    #photoResult {
      display: none;
      z-index: 5;
    }

    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: fill; 
      z-index: 10;
    }

    .countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 30px rgba(0,0,0,0.9), 0 0 10px rgba(255,0,85,0.8);
      display: none;
      z-index: 20;
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(1.15); }
    }

    .flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      z-index: 35;
      pointer-events: none;
    }

    .flash-active {
      animation: flashAnim 0.4s ease-out;
    }

    @keyframes flashAnim {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      z-index: 30;
    }

    .btn {
      padding: 16px 36px;
      font-size: 1.4rem;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(255, 0, 85, 0.5);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      font-size: 1.2rem;
      padding: 16px 24px;
    }

    .btn-danger {
      background: rgba(220, 53, 69, 0.8);
    }

    .result-overlay {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: rgba(15, 15, 20, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 40;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .qr-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ff0055;
      text-transform: uppercase;
    }

    #qrcode {
      background: white;
      padding: 8px;
      border-radius: 8px;
    }

    .gallery-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 12, 0.98);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 25px;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }

    .gallery-title {
      font-size: 1.8rem;
      color: #ff0055;
      font-weight: bold;
    }

    .gallery-actions {
      display: flex;
      gap: 10px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      overflow-y: auto;
      height: 100%;
      padding-right: 5px;
    }

    .gallery-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #222;
      background: #151515;
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-card-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 10px;
      display: flex;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .gallery-card:hover .gallery-card-actions {
      opacity: 1;
    }

    .icon-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      margin-top: 50px;
      color: #666;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <video id="webcam" autoplay playsinline></video>
    <img id="photoResult" alt="Photo prise" />
    
    <img id="frame" class="overlay-frame" src="cadre.png" alt="Cadre" onError="this.style.opacity='0'" />
    
    <div id="countdown" class="countdown">3</div>
    <div id="flash" class="flash"></div>
    
    <div id="resultOverlay" class="result-overlay">
      <div class="qr-title">Scanne ta photo</div>
      <div id="qrcode"></div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn" onclick="startPhotobooth()">📸 PRENDRE UNE PHOTO</button>
      <button id="galleryBtn" class="btn btn-secondary" onclick="toggleGallery()">🖼️ Galerie (<span id="photoCount">0</span>)</button>
    </div>
  </div>

  <div id="galleryModal" class="gallery-modal">
    <div class="gallery-header">
      <div class="gallery-title">Photos de la soirée</div>
      <div class="gallery-actions">
        <button class="btn btn-secondary btn-danger" onclick="clearAllPhotos()">🗑️ Tout effacer</button>
        <button class="btn btn-secondary" onclick="toggleGallery()">❌ Fermer</button>
      </div>
    </div>
    <div id="galleryGrid" class="gallery-grid"></div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const photoResult = document.getElementById('photoResult');
    const countdownEl = document.getElementById('countdown');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('canvas');
    const frame = document.getElementById('frame');
    const resultOverlay = document.getElementById('resultOverlay');
    const qrcodeEl = document.getElementById('qrcode');
    const flashEl = document.getElementById('flash');
    const galleryModal = document.getElementById('galleryModal');
    const galleryGrid = document.getElementById('galleryGrid');
    const photoCountEl = document.getElementById('photoCount');

    let db;

    // Initialisation IndexedDB pour stockage persistant illimité
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("PhotoboothDB", 1);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("photos")) {
            db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          loadPhotosFromDB();
          resolve();
        };
        request.onerror = (e) => reject(e);
      });
    }

    // Caméra
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1200 } } 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Erreur d'accès à la caméra : " + err);
      }
    }

    // Déclencher la photo
    function startPhotobooth() {
      startBtn.style.display = 'none';
      photoResult.style.display = 'none';
      resultOverlay.style.display = 'none';
      video.style.display = 'block';
      
      let count = 3;
      countdownEl.innerText = count;
      countdownEl.style.display = 'block';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          triggerFlash();
          takePhoto();
        }
      }, 1000);
    }

    function triggerFlash() {
      flashEl.classList.add('flash-active');
      setTimeout(() => flashEl.classList.remove('flash-active'), 400);
    }

    // Prise de vue
    function takePhoto() {
      const context = canvas.getContext('2d');
      const w = video.videoWidth || 1920;
      const h = video.videoHeight || 1200;
      canvas.width = w;
      canvas.height = h;

      // Effet miroir webcam
      context.save();
      context.scale(-1, 1);
      context.drawImage(video, -w, 0, w, h);
      context.restore();

      // Application du cadre PNG
      if (frame.complete && frame.naturalWidth !== 0) {
        context.drawImage(frame, 0, 0, w, h);
      }

      const imageData = canvas.toDataURL('image/jpeg', 0.90);
      photoResult.src = imageData;

      // Sauvegarde dans la base IndexedDB
      savePhotoToDB(imageData);

      // QR Code
      qrcodeEl.innerHTML = "";
      new QRCode(qrcodeEl, { text: imageData, width: 120, height: 120 });

      video.style.display = 'none';
      photoResult.style.display = 'block';
      resultOverlay.style.display = 'flex';
      
      setTimeout(() => {
        startBtn.innerText = "📸 PRENDRE UNE AUTRE PHOTO";
        startBtn.style.display = 'flex';
      }, 6000);
    }

    // Sauvegarde IndexedDB
    function savePhotoToDB(dataUrl) {
      const tx = db.transaction("photos", "readwrite");
      const store = tx.objectStore("photos");
      store.add({ data: dataUrl, timestamp: new Date().getTime() });
      tx.oncomplete = () => loadPhotosFromDB();
    }

    // Charger photos depuis IndexedDB
    function loadPhotosFromDB() {
      const tx = db.transaction("photos", "readonly");
      const store = tx.objectStore("photos");
      const request = store.getAll();

      request.onsuccess = () => {
        const photos = request.result.reverse();
        photoCountEl.innerText = photos.length;
        galleryGrid.innerHTML = "";

        if (photos.length === 0) {
          galleryGrid.innerHTML = '<div class="empty-msg">Aucune photo enregistrée pour le moment.</div>';
          return;
        }

        photos.forEach(item => {
          const card = document.createElement('div');
          card.className = 'gallery-card';
          card.innerHTML = `
            <img src="${item.data}" alt="Photo" />
            <div class="gallery-card-actions">
              <a href="${item.data}" download="photo_${item.id}.jpg" class="icon-btn">💾 Enregistrer</a>
              <button onclick="deletePhoto(${item.id})" class="icon-btn" style="background:rgba(255,0,0,0.5)">🗑️</button>
            </div>
          `;
          galleryGrid.appendChild(card);
        });
      };
    }

    // Supprimer une photo
    window.deletePhoto = function(id) {
      const tx = db.transaction("photos", "readwrite");
      tx.objectStore("photos").delete(id);
      tx.oncomplete = () => loadPhotosFromDB();
    };

    // Vider toutes les photos
    window.clearAllPhotos = function() {
      if (confirm("Voulez-vous vraiment effacer toutes les photos de la galerie ?")) {
        const tx = db.transaction("photos", "readwrite");
        tx.objectStore("photos").clear();
        tx.oncomplete = () => loadPhotosFromDB();
      }
    };

    function toggleGallery() {
      const isVisible = galleryModal.style.display === 'flex';
      galleryModal.style.display = isVisible ? 'none' : 'flex';
    }

    document.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'Enter') && startBtn.style.display !== 'none' && galleryModal.style.display !== 'flex') {
        startPhotobooth();
      }
    });

    initDB().then(() => initCamera());
  </script>
</body>
</html>
