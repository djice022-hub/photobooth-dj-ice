<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photobooth - DJ ICE</title>
  <!-- Librairie ZIP pour la galerie -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: white;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
    
    video, #photoResult {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    /* Dynamic frame overlay layer */
    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
    }

    .overlay-frame svg, .overlay-frame img {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    
    #photoResult { display: none; z-index: 5; }
    video { z-index: 1; }
    
    .countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 40px rgba(0,0,0,0.9);
      display: none;
      z-index: 20;
    }

    /* Bouton principal de prise de vue */
    .btn-shoot {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 22px 60px;
      font-size: 2rem;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      z-index: 30;
      box-shadow: 0 6px 30px rgba(255, 0, 85, 0.6);
      transition: all 0.2s ease;
    }
    .btn-shoot:active { transform: translateX(-50%) scale(0.95); }

    /* Boutons de la barre supérieure */
    .top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 35;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn-top {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-top:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Banner d'information en bas une fois la photo prise */
    #djNotice {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ff0055;
      padding: 20px 40px;
      border-radius: 40px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff;
      text-align: center;
      display: none;
      z-index: 40;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
      white-space: nowrap;
    }

    /* Décompte de temps */
    #reloadNotice {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(0,0,0,0.75);
      padding: 12px 25px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.2rem;
      display: none;
      z-index: 40;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* Modal de Sélection des Cadres */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 25px;
      max-width: 600px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .frame-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .frame-option {
      border: 2px solid #333;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      background: #181818;
      transition: all 0.2s ease;
    }
    .frame-option:hover {
      border-color: #ff0055;
      background: #222;
    }
    .frame-option.active {
      border-color: #ff0055;
      background: rgba(255, 0, 85, 0.15);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }
    .frame-option-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 8px;
    }

    .custom-upload-box {
      margin-top: 15px;
      padding: 15px;
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 12px;
      text-align: center;
      background: rgba(255,255,255,0.03);
    }

    /* Galerie */
    .gallery-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 30px;
      overflow-y: auto;
    }
    
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .gallery-actions {
      display: flex;
      gap: 15px;
    }

    .btn-action {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-zip { background: #00cc66; color: white; }
    .btn-close { background: #ff3333; color: white; }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #333;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item-actions {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 5px;
    }

    .gallery-item-actions a, .btn-delete {
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 6px 12px;
      border-radius: 15px;
      text-decoration: none;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-delete { background: rgba(255, 0, 0, 0.8); }
  </style>
</head>
<body>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <img id="photoResult" alt="Photo prise" />
    
    <!-- Dynamic Frame Overlay -->
    <div id="frameOverlay" class="overlay-frame"></div>
    
    <div id="countdown" class="countdown">3</div>
    
    <div class="top-bar">
      <button class="btn-top" onclick="toggleFrameModal()">🖼️ Changer de cadre</button>
      <button class="btn-top" onclick="resetToCamera()">🔄 Rafraîchir</button>
      <button class="btn-top" onclick="toggleGallery()">📁 Galerie (<span id="photoCount">0</span>)</button>
    </div>

    <div id="djNotice">📱 Venez chercher votre photo auprès du DJ</div>

    <div id="reloadNotice">Photo affichée pendant <span id="timerSec">15</span>s...</div>

    <button id="startBtn" class="btn-shoot" onclick="startPhotobooth()">📸 PRENDRE UNE PHOTO</button>
  </div>

  <!-- Modal Choix du Cadre -->
  <div id="frameModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Sélectionner un cadre</h2>
        <button class="btn-action btn-close" onclick="toggleFrameModal()">❌</button>
      </div>
      <div class="frame-grid">
        <div class="frame-option active" id="opt-neon" onclick="selectFrame('neon')">
          <div style="font-size: 2rem;">⚡</div>
          <div class="frame-option-title">DJ ICE - Néon</div>
        </div>
        <div class="frame-option" id="opt-wedding" onclick="selectFrame('wedding')">
          <div style="font-size: 2rem;">✨</div>
          <div class="frame-option-title">Élégant / Mariage</div>
        </div>
        <div class="frame-option" id="opt-festive" onclick="selectFrame('festive')">
          <div style="font-size: 2rem;">🎉</div>
          <div class="frame-option-title">Soirée Festive</div>
        </div>
        <div class="frame-option" id="opt-none" onclick="selectFrame('none')">
          <div style="font-size: 2rem;">🚫</div>
          <div class="frame-option-title">Sans cadre</div>
        </div>
      </div>

      <div class="custom-upload-box">
        <p style="margin-bottom: 8px; font-weight: bold;">📁 Importer votre propre cadre (.png transparent)</p>
        <input type="file" id="customFrameInput" accept="image/png" onchange="handleCustomFrameUpload(event)" style="font-size: 0.9rem;" />
      </div>
    </div>
  </div>

  <!-- Galerie -->
  <div id="galleryModal" class="gallery-modal">
    <div class="gallery-header">
      <h2>Galerie de la Soirée - DJ ICE</h2>
      <div class="gallery-actions">
        <button class="btn-action btn-zip" onclick="downloadAllZip()">Tout télécharger (.zip)</button>
        <button class="btn-action btn-close" onclick="toggleGallery()">Fermer ❌</button>
      </div>
    </div>
    <div id="galleryGrid" class="gallery-grid"></div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const photoResult = document.getElementById('photoResult');
    const countdownEl = document.getElementById('countdown');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('canvas');
    const frameOverlay = document.getElementById('frameOverlay');
    const djNotice = document.getElementById('djNotice');
    const galleryModal = document.getElementById('galleryModal');
    const frameModal = document.getElementById('frameModal');
    const galleryGrid = document.getElementById('galleryGrid');
    const photoCountEl = document.getElementById('photoCount');
    const reloadNotice = document.getElementById('reloadNotice');
    const timerSec = document.getElementById('timerSec');

    let db;
    let reloadTimer = null;
    let currentFrame = 'neon'; // Options: 'neon', 'wedding', 'festive', 'none', 'custom'
    let customFrameImg = null;

    // SVG Templates for Frame Rendering
    const FRAME_SVGS = {
      neon: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <defs>
            <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff0055" />
              <stop offset="50%" stop-color="#00f0ff" />
              <stop offset="100%" stop-color="#ff0055" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="10" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="url(#neonGrad)" stroke-width="12" filter="url(#glow)" />
          <rect x="35" y="35" width="1850" height="1010" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" />
          <!-- Header DJ ICE -->
          <rect x="760" y="20" width="400" height="60" rx="30" fill="#000" stroke="url(#neonGrad)" stroke-width="4" />
          <text x="960" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="4">DJ ICE</text>
          <!-- Bottom badge -->
          <text x="960" y="1030" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">PARTY NIGHT • PHOTOBOOTH</text>
        </svg>
      `,
      wedding: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <rect x="30" y="30" width="1860" height="1020" fill="none" stroke="#d4af37" stroke-width="6" />
          <rect x="45" y="45" width="1830" height="990" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="10 5" />
          <text x="960" y="90" font-family="Georgia, serif" font-size="36" font-style="italic" fill="#d4af37" text-anchor="middle">Souverains &amp; Invités</text>
          <text x="960" y="1020" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#d4af37" text-anchor="middle">Un jour inoubliable • DJ ICE</text>
        </svg>
      `,
      festive: `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <rect x="25" y="25" width="1870" height="1030" fill="none" stroke="#ff0055" stroke-width="10" />
          <circle cx="50" cy="50" r="25" fill="#ffcc00" />
          <circle cx="1870" cy="50" r="25" fill="#00cc66" />
          <circle cx="50" cy="1030" r="25" fill="#00ccff" />
          <circle cx="1870" cy="1030" r="25" fill="#ff0055" />
          <text x="960" y="1015" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#ffcc00" text-anchor="middle" letter-spacing="3">🎉 LET'S PARTY WITH DJ ICE 🎉</text>
        </svg>
      `
    };

    const request = indexedDB.open("PhotoboothDB", 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("photos")) {
        db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      updateGalleryUI();
    };

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1200 } } 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Erreur d'accès à la caméra : " + err);
      }
      renderFrameOverlay();
    }

    function toggleFrameModal() {
      frameModal.style.display = (frameModal.style.display === 'flex') ? 'none' : 'flex';
    }

    function selectFrame(frameKey) {
      currentFrame = frameKey;
      document.querySelectorAll('.frame-option').forEach(el => el.classList.remove('active'));
      const activeOpt = document.getElementById(`opt-${frameKey}`);
      if (activeOpt) activeOpt.classList.add('active');
      
      renderFrameOverlay();
      toggleFrameModal();
    }

    function handleCustomFrameUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            customFrameImg = img;
            currentFrame = 'custom';
            document.querySelectorAll('.frame-option').forEach(el => el.classList.remove('active'));
            renderFrameOverlay();
            toggleFrameModal();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function renderFrameOverlay() {
      frameOverlay.innerHTML = '';
      if (currentFrame === 'none') return;

      if (currentFrame === 'custom' && customFrameImg) {
        const imgEl = document.createElement('img');
        imgEl.src = customFrameImg.src;
        frameOverlay.appendChild(imgEl);
      } else if (FRAME_SVGS[currentFrame]) {
        frameOverlay.innerHTML = FRAME_SVGS[currentFrame];
      }
    }

    function resetToCamera() {
      if (reloadTimer) clearInterval(reloadTimer);
      photoResult.style.display = 'none';
      djNotice.style.display = 'none';
      reloadNotice.style.display = 'none';
      video.style.display = 'block';
      startBtn.style.display = 'block';
    }

    function startPhotobooth() {
      startBtn.style.display = 'none';
      photoResult.style.display = 'none';
      djNotice.style.display = 'none';
      reloadNotice.style.display = 'none';
      video.style.display = 'block';
      
      let count = 3;
      countdownEl.innerText = count;
      countdownEl.style.display = 'block';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          takePhoto();
        }
      }, 1000);
    }

    function takePhoto() {
      const context = canvas.getContext('2d');
      const w = video.videoWidth || 1920;
      const h = video.videoHeight || 1200;
      canvas.width = w;
      canvas.height = h;

      // Draw webcam feed
      context.drawImage(video, 0, 0, w, h);

      // Function to finish photo creation after overlay drawing
      const finalizePhoto = () => {
        const imageData = canvas.toDataURL('image/jpeg', 0.88);

        // Display photo and info banner
        photoResult.src = imageData;
        video.style.display = 'none';
        photoResult.style.display = 'block';
        djNotice.style.display = 'block';
        reloadNotice.style.display = 'block';

        // Save in IndexedDB gallery
        const transaction = db.transaction(["photos"], "readwrite");
        const store = transaction.objectStore("photos");
        store.add({ image: imageData, timestamp: Date.now() });

        transaction.oncomplete = () => {
          updateGalleryUI();
        };

        // 15-second timer countdown
        let timeLeft = 15;
        timerSec.innerText = timeLeft;
        
        if (reloadTimer) clearInterval(reloadTimer);
        
        reloadTimer = setInterval(() => {
          timeLeft--;
          timerSec.innerText = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(reloadTimer);
            resetToCamera();
          }
        }, 1000);
      };

      // Draw active frame onto canvas
      if (currentFrame === 'none') {
        finalizePhoto();
      } else if (currentFrame === 'custom' && customFrameImg) {
        context.drawImage(customFrameImg, 0, 0, w, h);
        finalizePhoto();
      } else if (FRAME_SVGS[currentFrame]) {
        const svgStr = FRAME_SVGS[currentFrame];
        const img = new Image();
        const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
          context.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          finalizePhoto();
        };
        img.src = url;
      } else {
        finalizePhoto();
      }
    }

    function updateGalleryUI() {
      if (!db) return;
      const transaction = db.transaction(["photos"], "readonly");
      const store = transaction.objectStore("photos");
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = () => {
        const photos = getAllRequest.result.reverse();
        photoCountEl.innerText = photos.length;
        galleryGrid.innerHTML = "";

        photos.forEach((item) => {
          const gridItem = document.createElement('div');
          gridItem.className = 'gallery-item';
          gridItem.innerHTML = `
            <img src="${item.image}" alt="Photo ${item.id}" />
            <div class="gallery-item-actions">
              <a href="${item.image}" download="photo_dj_ice_${item.timestamp}.jpg">💾 Télécharger</a>
              <button class="btn-delete" onclick="deletePhoto(${item.id})">🗑️ Supprimer</button>
            </div>
          `;
          galleryGrid.appendChild(gridItem);
        });
      };
    }

    function deletePhoto(id) {
      if (confirm("Voulez-vous vraiment supprimer cette photo ?")) {
        const transaction = db.transaction(["photos"], "readwrite");
        const store = transaction.objectStore("photos");
        store.delete(id);

        transaction.oncomplete = () => {
          updateGalleryUI();
        };
      }
    }

    function toggleGallery() {
      galleryModal.style.display = (galleryModal.style.display === 'flex') ? 'none' : 'flex';
    }

    function downloadAllZip() {
      const transaction = db.transaction(["photos"], "readonly");
      const store = transaction.objectStore("photos");
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = () => {
        const photos = getAllRequest.result;
        if (photos.length === 0) {
          alert("Aucune photo dans la galerie.");
          return;
        }

        const zip = new JSZip();
        photos.forEach((item, index) => {
          const base64Data = item.image.replace(/^data:image\/jpeg;base64,/, "");
          zip.file(`photo_dj_ice_${index + 1}.jpg`, base64Data, { base64: true });
        });

        zip.generateAsync({ type: "blob" }).then((content) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(content);
          a.download = "photobooth_dj_ice_soiree.zip";
          a.click();
        });
      };
    }

    // Key shortcut
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && startBtn.style.display !== 'none' && frameModal.style.display !== 'flex' && galleryModal.style.display !== 'flex') {
        startPhotobooth();
      }
    });

    initCamera();
  </script>
</body>
</html>
