<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photobooth - DJ ICE</title>
  <!-- Librairie QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Librairie ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: white;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
    
    video, #photoResult {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .overlay-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: fill; 
      z-index: 10;
    }
    
    #photoResult { display: none; z-index: 5; }
    video { z-index: 1; }
    
    .countdown {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 40px rgba(0,0,0,0.9);
      display: none;
      z-index: 20;
    }

    /* Bouton principal de prise de photo */
    .btn-shoot {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 22px 60px;
      font-size: 2rem;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      z-index: 30;
      box-shadow: 0 6px 30px rgba(255, 0, 85, 0.6);
    }
    .btn-shoot:active { transform: translateX(-50%) scale(0.95); }

    /* Boutons en haut */
    .top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 15px;
      z-index: 35;
    }

    .btn-top {
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
    }

    /* Container du QR Code */
    #qrContainer {
      position: absolute;
      bottom: 30px;
      right: 30px;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 40;
      color: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    #qrContainer p {
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
      text-align: center;
    }

    /* Message de rafraîchissement */
    #reloadNotice {
      position: absolute;
      top: 30px;
      left: 30px;
      background: rgba(0,0,0,0.7);
      padding: 12px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
      z-index: 40;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Galerie */
    .gallery-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 30px;
      overflow-y: auto;
    }
    
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .gallery-actions {
      display: flex;
      gap: 15px;
    }

    .btn-action {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-zip { background: #00cc66; color: white; }
    .btn-close { background: #ff3333; color: white; }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #333;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item-actions {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 5px;
    }

    .gallery-item-actions a, .btn-delete {
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 6px 12px;
      border-radius: 15px;
      text-decoration: none;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-delete {
      background: rgba(255, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <img id="photoResult" alt="Photo prise" />
    <img id="frame" class="overlay-frame" src="cadre.png" alt="Cadre" onError="this.style.display='none'" />
    
    <div id="countdown" class="countdown">3</div>
    
    <div class="top-bar">
      <button class="btn-top" onclick="forceRefresh()">🔄 Rafraîchir</button>
      <button class="btn-top" onclick="toggleGallery()">🖼️ Galerie (<span id="photoCount">0</span>)</button>
    </div>

    <div id="qrContainer">
      <div id="qrcode"></div>
      <p>📱 Scanne pour ouvrir<br>la galerie</p>
    </div>

    <div id="reloadNotice">Retour caméra dans <span id="timerSec">15</span>s...</div>

    <button id="startBtn" class="btn-shoot" onclick="startPhotobooth()">📸 PRENDRE UNE PHOTO</button>
  </div>

  <!-- Galerie -->
  <div id="galleryModal" class="gallery-modal">
    <div class="gallery-header">
      <h2>Galerie de la Soirée</h2>
      <div class="gallery-actions">
        <button class="btn-action btn-zip" onclick="downloadAllZip()">Tout télécharger (.zip)</button>
        <button class="btn-action btn-close" onclick="toggleGallery()">Fermer ❌</button>
      </div>
    </div>
    <div id="galleryGrid" class="gallery-grid"></div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const photoResult = document.getElementById('photoResult');
    const countdownEl = document.getElementById('countdown');
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('canvas');
    const frame = document.getElementById('frame');
    const qrContainer = document.getElementById('qrContainer');
    const qrcodeEl = document.getElementById('qrcode');
    const galleryModal = document.getElementById('galleryModal');
    const galleryGrid = document.getElementById('galleryGrid');
    const photoCountEl = document.getElementById('photoCount');
    const reloadNotice = document.getElementById('reloadNotice');
    const timerSec = document.getElementById('timerSec');

    let db;
    let reloadTimer = null;

    // Initialisation Base de données
    const request = indexedDB.open("PhotoboothDB", 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("photos")) {
        db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      updateGalleryUI();
    };

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1200 } } 
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Erreur d'accès à la caméra : " + err);
      }
    }

    function forceRefresh() {
      window.location.reload(true);
    }

    function startPhotobooth() {
      startBtn.style.display = 'none';
      photoResult.style.display = 'none';
      qrContainer.style.display = 'none';
      reloadNotice.style.display = 'none';
      video.style.display = 'block';
      
      let count = 3;
      countdownEl.innerText = count;
      countdownEl.style.display = 'block';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.innerText = count;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          takePhoto();
        }
      }, 1000);
    }

    function takePhoto() {
      const context = canvas.getContext('2d');
      const w = video.videoWidth || 1920;
      const h = video.videoHeight || 1200;
      canvas.width = w;
      canvas.height = h;

      context.drawImage(video, 0, 0, w, h);

      if (frame.complete && frame.naturalWidth !== 0 && frame.style.display !== 'none') {
        context.drawImage(frame, 0, 0, w, h);
      }

      const imageData = canvas.toDataURL('image/jpeg', 0.90);
      photoResult.src = imageData;

      // Sauvegarde dans la base de données
      const transaction = db.transaction(["photos"], "readwrite");
      const store = transaction.objectStore("photos");
      store.add({ image: imageData, timestamp: Date.now() });

      transaction.oncomplete = () => {
        updateGalleryUI();
      };

      // Génération du QR Code
      const targetURL = window.location.href.split('?')[0];
      qrcodeEl.innerHTML = "";
      new QRCode(qrcodeEl, { text: targetURL, width: 120, height: 120 });

      video.style.display = 'none';
      photoResult.style.display = 'block';
      qrContainer.style.display = 'flex';
      reloadNotice.style.display = 'block';

      // Décompte de 15 secondes puis rechargement
      let timeLeft = 15;
      timerSec.innerText = timeLeft;
      
      if (reloadTimer) clearInterval(reloadTimer);
      
      reloadTimer = setInterval(() => {
        timeLeft--;
        timerSec.innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(reloadTimer);
          forceRefresh();
        }
      }, 1000);
    }

    function updateGalleryUI() {
      if (!db) return;
      const transaction = db.transaction(["photos"], "readonly");
      const store = transaction.objectStore("photos");
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = () => {
        const photos = getAllRequest.result.reverse();
        photoCountEl.innerText = photos.length;
        galleryGrid.innerHTML = "";

        photos.forEach((item) => {
          const gridItem = document.createElement('div');
          gridItem.className = 'gallery-item';
          gridItem.innerHTML = `
            <img src="${item.image}" alt="Photo ${item.id}" />
            <div class="gallery-item-actions">
              <a href="${item.image}" download="photo_dj_ice_${item.timestamp}.jpg">💾 Télécharger</a>
              <button class="btn-delete" onclick="deletePhoto(${item.id})">🗑️ Supprimer</button>
            </div>
          `;
          galleryGrid.appendChild(gridItem);
        });
      };
    }

    function deletePhoto(id) {
      if (confirm("Voulez-vous vraiment supprimer cette photo ?")) {
        const transaction = db.transaction(["photos"], "readwrite");
        const store = transaction.objectStore("photos");
        store.delete(id);

        transaction.oncomplete = () => {
          updateGalleryUI();
        };
      }
    }

    function toggleGallery() {
      galleryModal.style.display = (galleryModal.style.display === 'flex') ? 'none' : 'flex';
    }

    function downloadAllZip() {
      const transaction = db.transaction(["photos"], "readonly");
      const store = transaction.objectStore("photos");
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = () => {
        const photos = getAllRequest.result;
        if (photos.length === 0) {
          alert("Aucune photo dans la galerie.");
          return;
        }

        const zip = new JSZip();
        photos.forEach((item, index) => {
          const base64Data = item.image.replace(/^data:image\/jpeg;base64,/, "");
          zip.file(`photo_dj_ice_${index + 1}.jpg`, base64Data, { base64: true });
        });

        zip.generateAsync({ type: "blob" }).then((content) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(content);
          a.download = "photobooth_dj_ice_soiree.zip";
          a.click();
        });
      };
    }

    // Touche Espace pour déclencher
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && startBtn.style.display !== 'none') {
        startPhotobooth();
      }
    });

    initCamera();
  </script>
</body>
</html>
